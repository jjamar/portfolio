<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Preview · Depoimentos em grade 2x2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --cream-2: #fdfaf4;
    --line: #e3dccc;
    --line-2: #d0c7b5;
    --navy: #0d1b2a;
    --ink-2: #3c4657;
    --ink-3: #5c6474;
    --red: #e84c2b;
    --font-display: 'Sora', system-ui, sans-serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --wrap: 1060px;
  }
  * { box-sizing: border-box; }
  html { background: var(--cream); color: var(--navy); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body { margin: 0; font-size: 1.0625rem; line-height: 1.7; }
  img { max-width: 100%; height: auto; display: block; }
  a { color: var(--navy); text-decoration-color: var(--line-2); text-underline-offset: 3px; }
  a:hover { color: var(--red); text-decoration-color: var(--red); }
  h2 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.015em; line-height: 1.22; margin: 0; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 24px; }
  .section { padding: 60px 0 72px; }
  .section-title { font-size: clamp(1.4rem, 2.6vw, 1.75rem); margin-bottom: 28px; }
  .link-red { color: var(--red); font-weight: 500; text-decoration-color: var(--red); }
  .depo-link { font-size: 0.86rem; margin: 30px 0 0; }

  /* barra de preview, não faz parte do site */
  .preview-bar { background: var(--navy); color: var(--cream); padding: 14px 0; font-size: 0.82rem; position: sticky; top: 0; z-index: 5; }
  .preview-bar .wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .preview-bar strong { font-family: var(--font-display); font-weight: 600; }
  .toggle { margin-left: auto; display: flex; gap: 8px; }
  .toggle button {
    font-family: var(--font-body); font-size: 0.8rem; padding: 6px 14px;
    border: 1px solid rgba(245,240,232,0.35); background: transparent; color: var(--cream);
    border-radius: 999px; cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
  .ctx { color: var(--ink-3); font-size: 0.86rem; padding: 18px 0 0; margin: 0; font-style: italic; }

  /* ---------- opção A: grade 2x2 ---------- */
  .depo-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 34px 44px; }
  .depo-card {
    margin: 0;
    display: flex;
    flex-direction: column;
    border-top: 2px solid var(--navy);
    padding-top: 20px;
  }
  .depo-card .depo-quote {
    font-size: 1rem;
    line-height: 1.62;
    color: var(--ink-2);
    margin: 0 0 22px;
    flex: 1;
  }
  .depo-card figcaption { display: flex; gap: 14px; align-items: center; }
  .depo-card img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .depo-nome { font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; margin: 0; }
  .depo-cargo { font-size: 0.86rem; color: var(--ink-3); margin: 1px 0 0; }

  /* ---------- opção B: lista atual ---------- */
  .depo-lista { display: flex; flex-direction: column; }
  .depo + .depo { margin-top: 38px; border-top: 1px solid var(--line); padding-top: 38px; }
  .depo { display: flex; gap: 30px; align-items: flex-start; max-width: 860px; margin: 0; }
  .depo > img { width: 108px; height: 108px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .depo .depo-quote { font-size: 1.18rem; line-height: 1.62; color: var(--navy); margin: 0 0 20px; }

  [hidden] { display: none !important; }

  @media (max-width: 860px) {
    .depo-grade { grid-template-columns: 1fr; gap: 30px; }
    .depo { flex-direction: column; gap: 20px; }
    .depo > img { width: 88px; height: 88px; }
    .depo .depo-quote { font-size: 1.06rem; }
  }
</style>
</head>
<body>

<div class="preview-bar">
  <div class="wrap">
    <strong>Preview</strong> · seção "Como é trabalhar comigo" com 4 depoimentos
    <span class="toggle">
      <button type="button" data-alvo="grade" aria-pressed="true">Grade 2x2</button>
      <button type="button" data-alvo="lista" aria-pressed="false">Lista atual</button>
    </span>
  </div>
</div>

<div class="wrap"><p class="ctx">Acima desta seção fica "Quem decide e constrói"; abaixo, "Princípios de trabalho".</p></div>

<!-- ============ OPÇÃO A: GRADE 2x2 ============ -->
<section class="section wrap" id="grade" aria-label="Depoimentos em grade">
  <h2 class="section-title">Como é trabalhar comigo</h2>
  <div class="depo-grade">

    <figure class="depo-card">
      <blockquote class="depo-quote">“Sua orientação prática sobre visão de produto alinhada à visão de mercado trouxe clareza para minha postura profissional. Ele não apenas me ajudou a destravar meu potencial [...], mas também me deu muita confiança para tomar decisões mais assertivas.”</blockquote>
      <figcaption>
        <img src="public/fotos/depoimentos/samara-cherem.webp" alt="Retrato de Samara Cherem" width="56" height="56">
        <span>
          <p class="depo-nome">Samara Cherem</p>
          <p class="depo-cargo">Associate Product Manager</p>
        </span>
      </figcaption>
    </figure>

    <figure class="depo-card">
      <blockquote class="depo-quote">“Desde o começo, ele acreditou no meu potencial, soube enxergar meus pontos fortes, me deu espaço para construir [...] e me incentivou a assumir desafios cada vez maiores. Essa confiança foi um dos fatores que contribuíram para que eu fosse promovida a Product Manager. [...] Ele acredita de verdade na construção de uma cultura de Produto e aproveita cada oportunidade para desenvolver as pessoas ao seu redor.”</blockquote>
      <figcaption>
        <img src="public/fotos/depoimentos/raquel-moraes.webp" alt="Retrato de Raquel Moraes" width="56" height="56">
        <span>
          <p class="depo-nome">Raquel Moraes</p>
          <p class="depo-cargo">Product Manager</p>
        </span>
      </figcaption>
    </figure>

    <figure class="depo-card">
      <blockquote class="depo-quote">“Ao longo da minha transição de carreira para Product Owner, tive a sorte de contar com a orientação do Jamar. Em um momento de tantas dúvidas e decisões importantes, ele foi um mentor fundamental. Sempre muito presente, atencioso e disposto a compartilhar conhecimento, me ajudou a enxergar caminhos com mais clareza e confiança. [...] É um líder daqueles que realmente se preocupam com o desenvolvimento das pessoas e fazem questão de impulsionar quem está ao seu redor.”</blockquote>
      <figcaption>
        <img src="public/fotos/depoimentos/thamyres-queiroz.webp" alt="Retrato de Thamyres Queiroz Firme" width="56" height="56">
        <span>
          <p class="depo-nome">Thamyres Queiroz Firme</p>
          <p class="depo-cargo">Product Owner</p>
        </span>
      </figcaption>
    </figure>

    <figure class="depo-card">
      <blockquote class="depo-quote">“Jamar sempre demonstrou uma visão estratégica muito clara, excelente capacidade de comunicação e grande habilidade para conectar diferentes áreas em torno dos objetivos do produto. [...] Ele constantemente trazia novas formas de trabalhar, compartilhava dicas práticas para otimizar nosso dia a dia e estimulava o time a pensar de forma mais estratégica.”</blockquote>
      <figcaption>
        <img src="public/fotos/depoimentos/jose-carlos-machado.webp" alt="Retrato de José Carlos Machado" width="56" height="56">
        <span>
          <p class="depo-nome">José Carlos Machado</p>
          <p class="depo-cargo">Product Owner</p>
        </span>
      </figcaption>
    </figure>

  </div>
  <p class="depo-link"><a class="link-red" href="https://www.linkedin.com/in/jonatanjamar/" target="_blank" rel="noopener">Depoimentos completos no LinkedIn →</a></p>
</section>

<!-- ============ OPÇÃO B: LISTA ATUAL ============ -->
<section class="section wrap" id="lista" aria-label="Depoimentos em lista" hidden>
  <h2 class="section-title">Como é trabalhar comigo</h2>
  <div class="depo-lista">

    <figure class="depo">
      <img src="public/fotos/depoimentos/samara-cherem.webp" alt="Retrato de Samara Cherem" width="108" height="108">
      <div>
        <blockquote class="depo-quote">“Sua orientação prática sobre visão de produto alinhada à visão de mercado trouxe clareza para minha postura profissional. Ele não apenas me ajudou a destravar meu potencial [...], mas também me deu muita confiança para tomar decisões mais assertivas.”</blockquote>
        <figcaption>
          <p class="depo-nome">Samara Cherem</p>
          <p class="depo-cargo">Associate Product Manager</p>
        </figcaption>
      </div>
    </figure>

    <figure class="depo">
      <img src="public/fotos/depoimentos/raquel-moraes.webp" alt="Retrato de Raquel Moraes" width="108" height="108">
      <div>
        <blockquote class="depo-quote">“Desde o começo, ele acreditou no meu potencial, soube enxergar meus pontos fortes, me deu espaço para construir [...] e me incentivou a assumir desafios cada vez maiores. Essa confiança foi um dos fatores que contribuíram para que eu fosse promovida a Product Manager. [...] Ele acredita de verdade na construção de uma cultura de Produto e aproveita cada oportunidade para desenvolver as pessoas ao seu redor.”</blockquote>
        <figcaption>
          <p class="depo-nome">Raquel Moraes</p>
          <p class="depo-cargo">Product Manager</p>
        </figcaption>
      </div>
    </figure>

    <figure class="depo">
      <img src="public/fotos/depoimentos/thamyres-queiroz.webp" alt="Retrato de Thamyres Queiroz Firme" width="108" height="108">
      <div>
        <blockquote class="depo-quote">“Ao longo da minha transição de carreira para Product Owner, tive a sorte de contar com a orientação do Jamar. Em um momento de tantas dúvidas e decisões importantes, ele foi um mentor fundamental. Sempre muito presente, atencioso e disposto a compartilhar conhecimento, me ajudou a enxergar caminhos com mais clareza e confiança. [...] É um líder daqueles que realmente se preocupam com o desenvolvimento das pessoas e fazem questão de impulsionar quem está ao seu redor.”</blockquote>
        <figcaption>
          <p class="depo-nome">Thamyres Queiroz Firme</p>
          <p class="depo-cargo">Product Owner</p>
        </figcaption>
      </div>
    </figure>

    <figure class="depo">
      <img src="public/fotos/depoimentos/jose-carlos-machado.webp" alt="Retrato de José Carlos Machado" width="108" height="108">
      <div>
        <blockquote class="depo-quote">“Jamar sempre demonstrou uma visão estratégica muito clara, excelente capacidade de comunicação e grande habilidade para conectar diferentes áreas em torno dos objetivos do produto. [...] Ele constantemente trazia novas formas de trabalhar, compartilhava dicas práticas para otimizar nosso dia a dia e estimulava o time a pensar de forma mais estratégica.”</blockquote>
        <figcaption>
          <p class="depo-nome">José Carlos Machado</p>
          <p class="depo-cargo">Product Owner</p>
        </figcaption>
      </div>
    </figure>

  </div>
  <p class="depo-link"><a class="link-red" href="https://www.linkedin.com/in/jonatanjamar/" target="_blank" rel="noopener">Depoimentos completos no LinkedIn →</a></p>
</section>

<script>
  const botoes = document.querySelectorAll('.toggle button');
  botoes.forEach((b) => {
    b.addEventListener('click', () => {
      const alvo = b.dataset.alvo;
      botoes.forEach((o) => o.setAttribute('aria-pressed', String(o.dataset.alvo === alvo)));
      document.getElementById('grade').hidden = alvo !== 'grade';
      document.getElementById('lista').hidden = alvo !== 'lista';
      window.scrollTo({ top: 0 });
    });
  });
</script>

</body>
</html>
